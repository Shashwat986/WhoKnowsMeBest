<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Who Knows Me Best - Party Scoreboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(circle at 30% 40%, #fffae3 30%, #fbeaff 100%);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      font-family: "Luckiest Guy", cursive;
      transition: background 0.5s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: stretch;
      padding: 20px 10px 30px 10px;
    }
    h1 {
      font-size: 2em;
      color: #6a2ca0;
      text-shadow: 2px 2px 0 #fff, 4px 4px 12px #bd68e1;
      margin-bottom: 1rem;
      text-align: center;
    }
    #playerBoxContainer {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 4;
      font-family: "Luckiest Guy", cursive;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      max-width: 90vw;
    }
    #playerCollapseBtn {
      background: #ffd7f1;
      color: #6a2ca0;
      border: none;
      border-radius: 12px 12px 0 0;
      font-size: 1em;
      padding: 7px 20px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      box-shadow: 0 2px 5px #d5729a22;
      transition: background 0.2s, transform 0.2s;
      margin-bottom: 0;
      white-space: nowrap;
    }
    #playerCollapseBtn:hover {
      background: #ffec95;
      transform: scale(1.07);
    }
    #playerBox {
      background: #fff7f7b0;
      padding: 12px 20px 12px 20px;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 2px 10px #d5729a22;
      min-width: 230px;
      display: none;
      flex-direction: column;
      align-items: flex-end;
      margin-top: 0;
      max-height: 60vh;
      overflow-y: auto;
      box-sizing: border-box;
      width: 100%;
      max-width: 300px;
    }
    #playerBox.collapsed {
      display: none;
    }
    #playerBox.expanded {
      display: flex;
    }
    #playerBox label {
      font-size: 1.1em;
      color: #6a2ca0;
      margin-bottom: 7px;
      font-weight: bold;
    }
    .player-input {
      width: 100%;
      max-width: 260px;
      display: block;
      margin-bottom: 7px;
      border: 1px solid #da359c88;
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 1em;
      font-family: inherit;
      background: #fff;
      color: #d02c6d;
      box-sizing: border-box;
    }
    #scoreResetBtn {
      margin-top: 4px;
      align-self: flex-end;
      background: #ffd7f1;
      color: #da359c;
      border: none;
      border-radius: 14px;
      font-size: 1em;
      padding: 6px 14px;
      cursor: pointer;
      font-family: "Luckiest Guy", cursive;
      box-shadow: 0 2px 5px #8883;
      transition: background 0.2s, transform 0.2s;
      white-space: nowrap;
    }
    #scoreResetBtn:hover {
      background: #ffec95;
      transform: scale(1.07);
    }
    #picker, #questionScreen {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 10px 0 10px;
      box-sizing: border-box;
      margin-top: 10px;
    }
    .category-btn {
      background: #ffe9fb;
      color: #6a2ca0;
      font-size: 1.3em;
      padding: 1em 2em;
      margin: 10px;
      border: none;
      border-radius: 18px;
      font-family: "Luckiest Guy", cursive;
      cursor: pointer;
      box-shadow: 0 4px 14px #ccb9cf22;
      transition: background 0.2s, transform 0.2s;
      white-space: nowrap;
      flex-shrink: 1;
      min-width: 150px;
      text-align: center;
    }
    .category-btn:hover {
      background: #e5ceff;
      transform: scale(1.07) rotate(-2deg);
    }
    #question {
      font-family: "Luckiest Guy", cursive;
      font-size: 2.2em;
      color: #d02c6d;
      text-align: center;
      margin: 1.2em 0 1em 0;
      max-width: 90vw;
      min-height: 3em;
      word-break: break-word;
      user-select: none;
    }
    #scoreboard {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin: 16px 0 10px 0;
      max-width: 90vw;
      overflow-x: auto;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin; /* Firefox */
    }
    /* Hide scrollbar - WebKit browsers */
    #scoreboard::-webkit-scrollbar {
      height: 6px;
    }
    #scoreboard::-webkit-scrollbar-track {
      background: transparent;
    }
    #scoreboard::-webkit-scrollbar-thumb {
      background-color: #da359c88;
      border-radius: 3px;
    }
    .player-score {
      background: #ffe9fb;
      border-radius: 15px;
      padding: 6px 18px;
      font-size: 1.05em;
      color: #66227b;
      font-family: "Luckiest Guy", cursive;
      box-shadow: 0 1px 4px #ccb9cf15;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition: background 0.18s, color 0.2s;
      border: 2px solid transparent;
      min-width: 80px;
      justify-content: space-between;
      user-select: none;
      white-space: nowrap;
    }
    .player-score.correct {
      background: #c7ffd6;
      color: #185a57;
      border-color: #6dfdc0;
    }
    .player-score.incorrect {
      background: #ffe7e7;
      color: #913939;
      border-color: #fc8d8d;
    }
    .player-score .score {
      font-size: 1em;
      margin-left: 10px;
      font-weight: bold;
    }
    #questionBtns {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 26px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .action-btn {
      background: #ffec95;
      color: #da359c;
      border: none;
      border-radius: 38px;
      font-size: 1.3em;
      padding: 0.7em 2.2em;
      font-family: "Luckiest Guy", cursive;
      cursor: pointer;
      box-shadow: 0 2px 8px #8882;
      transition: background 0.2s, transform 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .action-btn:hover {
      background: #ffd7f1;
      transform: scale(1.07) rotate(-2deg);
    }
    .back-btn {
      background: #e5ceff;
      color: #6a2ca0;
    }
    /* Confetti styles */
    .confetti {
      position: fixed;
      pointer-events: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0.7;
      z-index: 999;
      animation: confetti-fall 1s linear forwards;
    }
    @keyframes confetti-fall {
      from { transform: translateY(0) scale(1); opacity: 0.7;}
      to { transform: translateY(320px) scale(1.2); opacity: 0;}
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.6em;
        margin-bottom: 0.8rem;
      }
      #playerBoxContainer {
        position: fixed;
        top: 10px;
        right: 10px;
        min-width: 180px;
        max-width: 90vw;
      }
      #playerBox {
        max-width: 90vw;
        min-width: unset;
      }
      .player-input {
        max-width: 100%;
        font-size: 0.95em;
        padding: 6px 8px;
      }
      #scoreResetBtn {
        padding: 6px 10px;
        font-size: 0.9em;
      }
      #picker, #questionScreen {
        padding: 60px 8px 0 8px;
        max-width: 100vw;
      }
      .category-btn {
        font-size: 1.1em;
        padding: 0.8em 1.5em;
        margin: 8px 6px;
        min-width: 130px;
      }
      #question {
        font-size: 1.8em;
        max-width: 95vw;
      }
      #scoreboard {
        max-width: 100vw;
        gap: 10px;
        margin: 14px 0 8px 0;
      }
      .player-score {
        font-size: 1em;
        padding: 5px 12px;
        min-width: 70px;
      }
      #questionBtns {
        margin-top: 18px;
        margin-bottom: 18px;
        gap: 12px;
      }
      .action-btn {
        font-size: 1.1em;
        padding: 0.6em 1.7em;
      }
    }
  </style>
</head>
<body>
  <h1>🎉 Who Knows Me Best? 🎉</h1>
  <div id="playerBoxContainer">
    <button id="playerCollapseBtn">Edit Players ▼</button>
    <div id="playerBox" class="collapsed">
      <label>Edit player names (max 10):</label>
      <div id="playerInputs"></div>
      <button id="scoreResetBtn" title="Reset all scores">🔄 Reset Scores</button>
    </div>
  </div>
  <div id="picker"></div>
  <div id="questionScreen" style="display:none;">
    <div id="question"></div>
    <div id="scoreboard"></div>
    <div id="questionBtns">
      <button class="action-btn" id="refreshBtn">🔄 New Question</button>
      <button class="action-btn back-btn" id="backBtn">⬅ Back</button>
    </div>
  </div>
  <script>
    const questionCategories = [
      {
        title: "Getting to Know the Basics",
        questions: [
          "What is my favorite color?",
          "Do I prefer coffee or tea?",
          "What is my zodiac sign?",
          "What is my shoe size?",
          "What city was I born in?",
          "What’s my favorite season?",
          "What is my favorite type of music?",
          "What is my favorite animal?"
        ]
      },
      {
        title: "Childhood Memories and Favorites",
        questions: [
          "What was my favorite childhood toy?",
          "What was my first pet’s name?",
          "What is my earliest childhood memory?",
          "What was my favorite subject in school?",
          "Which cartoon character was my favorite?",
          "Who was my first best friend?",
          "What was my favorite childhood movie?",
          "What sport did I play as a child?",
          "Did I have a nickname growing up?",
          "What was my favorite book as a child?"
        ]
      },
      {
        title: "Food Preferences and Pet Peeves",
        questions: [
          "What’s my go-to comfort food?",
          "What food do I absolutely hate?",
          "Am I a sweet or savory person?",
          "What’s my favorite ice cream flavor?",
          "What’s my favorite cuisine?",
          "What food could I eat every day?",
          "Do I prefer hot or cold drinks?",
          "What’s my favorite fast food restaurant?",
          "What’s my favorite snack?",
          "What’s my least favorite vegetable?"
        ]
      },
      {
        title: "Personal Preferences and Hobbies",
        questions: [
          "What’s my favorite hobby?",
          "Am I more of a morning person or a night owl?",
          "What’s my favorite book or movie?",
          "What’s my favorite way to relax?",
          "What kind of music makes me happy?",
          "What’s my favorite sport to watch?",
          "What’s my favorite outdoor activity?",
          "What’s my favorite indoor activity?",
          "Do I prefer cats or dogs?",
          "What’s my favorite type of weather?"
        ]
      },
      {
        title: "Future Dreams and Aspirations",
        questions: [
          "What is my dream job?",
          "Where would I love to travel next?",
          "Do I see myself living in a big city or a small town?",
          "What’s my biggest goal in life?",
          "What kind of house would I love to live in?",
          "What is one skill I wish to learn?",
          "What’s my dream car?",
          "What’s the one place I want to visit before I die?"
        ]
      },
      {
        title: "Fun and Quirky Questions",
        questions: [
          "What’s my go-to karaoke song?",
          "If I were an animal, what would I be?",
          "What superpower would I want?",
          "What’s my favorite holiday?",
          "What’s one word that describes me?",
          "What is my biggest phobia?",
          "What would I do if I won the lottery?",
          "What’s my favorite board game?",
          "If I could meet one celebrity, who would it be?",
          "What’s the most spontaneous thing I’ve ever done?",
          "What’s my guilty pleasure TV show?"
        ]
      }
    ];

    let players = JSON.parse(localStorage.getItem("players")) || Array.from({ length: 5 }, (_, i) => ({
      name: `Player ${i + 1}`,
      score: 0,
      state: null
    }));

    let currentCategoryIdx = null;
    let currentQuestionIdx = null;

    // Collapsible Player Box
    const playerCollapseBtn = document.getElementById('playerCollapseBtn');
    const playerBox = document.getElementById('playerBox');
    let collapsed = true;
    function updatePlayerBoxUI() {
      playerBox.className = collapsed ? 'collapsed' : 'expanded';
      playerCollapseBtn.innerHTML = collapsed ? 'Edit Players ▼' : 'Edit Players ▲';
    }
    playerCollapseBtn.onclick = () => { collapsed = !collapsed; updatePlayerBoxUI(); };
    updatePlayerBoxUI();

    function updatePlayerInputsUI() {
      const el = document.getElementById('playerInputs');
      el.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const inp = document.createElement('input');
        inp.className = 'player-input';
        inp.type = 'text';
        inp.value = players[i] ? players[i].name : '';
        inp.placeholder = `Player ${i + 1}`;
        inp.maxLength = 16;
        inp.oninput = () => {
          if (players[i]) { players[i].name = inp.value.trim(); }
          else if (inp.value.trim()) { players[i] = { name: inp.value.trim(), score: 0, state: null }; }
          savePlayers();
          renderScoreboard();
        };
        el.appendChild(inp);
      }
    }

    function savePlayers() {
      localStorage.setItem("players", JSON.stringify(players));
    }

    function resetScores() {
      players.forEach(p => {
        if (p) { p.score = 0; p.state = null; }
      });
      savePlayers();
      renderScoreboard();
    }

    document.getElementById('scoreResetBtn').onclick = resetScores;

    function showCategoryPicker() {
      document.getElementById('picker').style.display = 'flex';
      document.getElementById('questionScreen').style.display = 'none';
      document.getElementById('picker').innerHTML = '';
      questionCategories.forEach((cat, idx) => {
        const btn = document.createElement('button');
        btn.textContent = cat.title;
        btn.className = 'category-btn';
        btn.onclick = () => showQuestionScreen(idx);
        document.getElementById('picker').appendChild(btn);
      });
    }

    function showQuestionScreen(categoryIdx) {
      currentCategoryIdx = categoryIdx;
      document.getElementById('picker').style.display = 'none';
      document.getElementById('questionScreen').style.display = 'flex';
      showRandomQuestion();
    }

    function showRandomQuestion() {
      const questions = questionCategories[currentCategoryIdx].questions;
      let idx;
      do {
        idx = Math.floor(Math.random() * questions.length);
      } while (idx === currentQuestionIdx && questions.length > 1);
      currentQuestionIdx = idx;
      document.getElementById('question').textContent = questions[idx];
      players.forEach(p => { if (p) p.state = null; });
      renderScoreboard();
      throwConfetti();
    }

    function renderScoreboard() {
      const scoreboard = document.getElementById("scoreboard");
      scoreboard.innerHTML = '';
      players.forEach((p, i) => {
        if (!p || !p.name.trim()) return;
        const el = document.createElement('span');
        el.className = 'player-score' + (p.state === 'correct' ? ' correct' : p.state === 'incorrect' ? ' incorrect' : '');
        el.innerHTML = `
          <span class="name">${p.name}</span>
          <span class="score">${p.score}</span>
        `;
        el.title = "Click to toggle score: No Mark → Correct → Incorrect";
        el.onclick = () => {
          if (p.state === null) {
            p.state = 'correct';
            p.score += 1;
          } else if (p.state === 'correct') {
            p.score -= 1;
            p.state = 'incorrect';
          } else if (p.state === 'incorrect') {
            p.state = null;
          }
          savePlayers();
          renderScoreboard();
        };
        scoreboard.appendChild(el);
      });
    }

    function throwConfetti() {
      for (let i = 0; i < 36; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.top = 60 + Math.random() * 40 + "px";
        confetti.style.backgroundColor = [
          "#FF4691","#FFD166","#55DDFF","#64BEFF","#FFBE05","#C855F8","#da359c","#6a2ca0","#FF8C64"
        ][Math.floor(Math.random() * 9)];
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 1200);
      }
    }

    document.getElementById('refreshBtn').onclick = () => {
      showRandomQuestion();
    };
    document.getElementById('backBtn').onclick = () => {
      showCategoryPicker();
    };

    // Initialize page
    updatePlayerInputsUI();
    showCategoryPicker();

  </script>
</body>
</html>
